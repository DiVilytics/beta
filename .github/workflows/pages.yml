# Publishes the site on GitHub Pages at every push to main, with each deploy's
# own version stamped on the deployed copy (.github/stamp.py): the release as
# the commit, the beta (the DiVilytics/beta repository, same workflow) as
# beta-<commit>. Settings > Pages > Source must be "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version
        run: python3 .github/stamp.py "${{ github.repository == 'DiVilytics/beta' && 'beta-' || '' }}${GITHUB_SHA::8}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
