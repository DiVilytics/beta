<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DiVilytics</title>
  <!-- characters.html was renamed to villains.html (and ?char= to ?vil=). This
       stub forwards old links, keeping ?box=, ?pace= and any hash. Safe to
       delete once no old characters.html links remain in the wild. -->
  <script>
    const p = new URLSearchParams(location.search);
    if (p.has('char')) { p.set('vil', p.get('char')); p.delete('char'); }
    const q = p.toString();
    location.replace('villains.html' + (q ? '?' + q : '') + location.hash);
  </script>
  <meta http-equiv="refresh" content="0; url=villains.html">
</head>
<body></body>
</html>
