<head>
  <meta charset="UTF-8">

  <script src="i18n/it.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="/asset/favicon/favicon-96x96.png?v=20260603b" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/asset/favicon/favicon.svg?v=20260603b" />
  <link rel="shortcut icon" href="/asset/favicon/favicon.ico?v=20260603b" />
  <link rel="apple-touch-icon" sizes="180x180" href="/asset/favicon/apple-touch-icon.png?v=20260603b" />
  <meta name="apple-mobile-web-app-title" content="DiVilytics" />

  <link rel="manifest" href="/asset/favicon/site.webmanifest?v=20260603b" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6MTR91YL11"></script>
  <script>

    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6MTR91YL11');

</head>
<body>

<nav>
  <a class="nav-brand" href="index.html"><img src="asset/logos/logo-b.svg" alt="DiVilytics | Disney Villainous Analytics"></a>
  <div class="nav-right">
    <div class="nav-links">
      <a href="new-game.html" title="New Game" data-i18n-attr="title">⚔️</a>
      <a href="tournaments.html" title="Tournaments" data-i18n-attr="title">🏟️</a>
      <a href="game-log.html" title="Game Log" data-i18n-attr="title">🕒</a>
      <a href="leaderboard.html" title="Leaderboard" data-i18n-attr="title">🏆</a>
      <a href="villains.html" title="Villains" data-i18n-attr="title">🎭</a>
      <a href="players.html" id="navProfile" title="Player" data-i18n-attr="title">👤</a>
      <a href="charts.html" title="Charts" data-i18n-attr="title">📊</a>
    </div>
    <div class="nav-auth" id="navAuth"></div>
  </div>
</nav>

<main>
  <div class="page-header align-top">
    <div>
      <h2><span class="page-ico" aria-hidden="true">👤</span><span data-i18n>Players</span></h2>
    </div>
    <div class="cs-search">
      <input type="text" id="pfJumpInput" placeholder="Search player…" maxlength="30" autocomplete="off" data-i18n-attr="placeholder">
      <div class="cs-dropdown" id="pfDropdown"></div>
    </div>
  </div>
  <p class="page-intro" data-i18n>Any player's stats, achievements and games.</p>

  <div id="pfIdentity"></div>

  <div class="controls period-controls hidden" id="pfControls">
    <!-- Table size: All / Players menu / Solo (size-filter.js) -->
    <div id="pfSize"></div>
    <!-- Period: All time / Year / Month (period-filter.js) -->
    <div id="pfPeriod"></div>
  </div>

  <div id="pfRoot" class="spinner" data-i18n>Loading…</div>
</main>

<!-- Achievement detail sheet -->
<div class="overlay" id="achOverlay" onclick="if(event.target===this) _closeAchOverlay()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3 id="achTitle" data-i18n>Achievement</h3>
      <button class="sheet-close" onclick="_closeAchOverlay()">×</button>
    </div>
    <div class="sheet-body" id="achBody"></div>
  </div>
</div>


<!-- Share profile QR sheet -->
<div class="overlay" id="pfQrOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3 id="pfQrTitle" data-i18n>Share profile</h3>
      <button class="sheet-close" onclick="closeProfileQR()">×</button>
    </div>
    <div class="sheet-body">
      <p class="modal-hint" data-i18n>Others can scan this to view this player profile.</p>
      <div class="qr-wrap">
        <div id="pfQrCode"></div>
      </div>
      <div class="qr-url-row">
        <div class="qr-url" id="qrUrlText"></div>
        <button class="pf-btn" onclick="copyQrUrl()" title="Copy link" data-i18n-attr="title">⎘</button>
      </div>
    </div>
    <div class="sheet-footer">
      <button class="btn btn-primary" onclick="closeProfileQR()" data-i18n>Done</button>
    </div>
  </div>
</div>

<!-- The delete-game confirmation sheet is injected on demand by openConfirmSheet (ui.js). -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
  <script src="theme.js"></script>
  <script src="ui.js"></script>
  <script src="avatar.js"></script>
  <script src="achievements.js"></script>
  <script src="stats-table.js"></script>
  <script src="search.js"></script>
  <script src="game-card.js"></script>
  <script src="shared.js"></script>
<script src="period-filter.js"></script>
<script src="size-filter.js"></script>
<script src="solo.js"></script>
<script src="players.js"></script>
</body>
</html>
