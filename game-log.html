  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <meta name="robots" content="noindex">
  <script src="lang.js"></script>
  <script src="i18n/it.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="/asset/favicon/favicon-96x96.png?v=20260603b" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/asset/favicon/favicon.svg?v=20260603b" />
  <link rel="shortcut icon" href="/asset/favicon/favicon.ico?v=20260603b" />
  <link rel="apple-touch-icon" sizes="180x180" href="/asset/favicon/apple-touch-icon.png?v=20260603b" />
  <meta name="apple-mobile-web-app-title" content="DiVilytics" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="/asset/favicon/site.webmanifest?v=20260603b" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6MTR91YL11"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-6MTR91YL11');
  </script>
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html"><img src="asset/logos/logo-b.svg" alt="DiVilytics | Disney Villainous Analytics"></a>
  <div class="nav-right">
    <div class="nav-links">
      <a href="new-game.html" title="New Game" data-i18n-attr="title">🎲</a>
      <a href="game-log.html" title="Game Log" data-i18n-attr="title">🕒</a>
      <a href="leaderboard.html" title="Leaderboard" data-i18n-attr="title">🏆</a>
      <a href="villains.html" title="Villains" data-i18n-attr="title">🎭</a>
      <a href="players.html" id="navProfile" title="Player" data-i18n-attr="title">👤</a>
      <a href="charts.html" title="Charts" data-i18n-attr="title">📊</a>
    </div>
    <div class="nav-auth" id="navAuth"></div>
  </div>
</nav>

<main>
  <div class="page-header has-search-control">
    <h2 data-i18n>Game Log</h2>
    <div class="cs-search" id="locationSearch">
      <input type="text" id="locationSearchInput" placeholder="Filter by location…" autocomplete="off" disabled data-i18n-attr="placeholder">
      <div class="cs-dropdown" id="locationDropdown"></div>
    </div>
  </div>
  <p class="page-intro" data-i18n>Every recorded game, newest first.</p>

  <div class="err" id="err"></div>

  <!-- Filters -->
  <div class="filter-bar">
    <div class="pill-group" id="countPills">
      <button class="pill on" onclick="setCountFilter('all')" data-i18n>All</button>
      <button class="pill" onclick="setCountFilter(2)">2p</button>
      <button class="pill" onclick="setCountFilter(3)">3p</button>
      <button class="pill" onclick="setCountFilter(4)">4p</button>
      <button class="pill" onclick="setCountFilter(5)">5p</button>
      <button class="pill" onclick="setCountFilter(6)">6p</button>
    </div>
    <button class="filter-char-toggle" onclick="toggleCharFilter()" id="charFilterToggle">
      <span data-i18n>Included villains</span>
      <div class="toggle-right">
        <span class="badge" id="charBadge"></span>
        <span class="chevron" id="charChevron">▼</span>
      </div>
    </button>
    <div class="filter-char-panel" id="charFilterPanel">
      <div class="filter-actions">
        <button class="txt-btn" onclick="glExcludeAll()" data-i18n>Exclude all</button>
        <span class="sep">|</span>
        <button class="txt-btn owned-toggle" id="glMineBtn" type="button" onclick="glToggleMine()" data-i18n>My boxes</button>
        <span class="sep">|</span>
        <button class="txt-btn" onclick="glClearExcluded()" data-i18n>Clear</button>
        <button class="btn btn-primary btn-sm filter-apply-btn" onclick="applyCharFilter()" data-i18n>Done</button>
      </div>
      <div class="filter-bulk-row">
        <div class="seg pace-mode" id="glPaceMode">
          <button class="seg-btn on" type="button" onclick="glSetPaceMode(false)" title="Select only the chosen color" data-i18n data-i18n-attr="title">Pace</button>
          <button class="seg-btn"    type="button" onclick="glSetPaceMode(true)"  title="Also select the neighboring colors" data-i18n data-i18n-attr="title">Pace+</button>
        </div>
        <div class="pace-colors" id="glPaceColors">
          <button class="pace-color green"  data-pace="green"  onclick="glSelectPace('green')"  type="button" title="Only green villains" data-i18n-attr="title"></button>
          <button class="pace-color yellow" data-pace="yellow" onclick="glSelectPace('yellow')" type="button" title="Only yellow villains" data-i18n-attr="title"></button>
          <button class="pace-color orange" data-pace="orange" onclick="glSelectPace('orange')" type="button" title="Only orange villains" data-i18n-attr="title"></button>
          <button class="pace-color red"    data-pace="red"    onclick="glSelectPace('red')"    type="button" title="Only red villains" data-i18n-attr="title"></button>
        </div>
      </div>
      <p class="gl-filter-hint" data-i18n>Click to exclude villains; games using any excluded villain are hidden.</p>
      <div id="charGrid"></div>
    </div>
  </div>

  <div class="list-header">
    <div class="results-hint" id="resultsHint"></div>
    <div id="locationPillArea"></div>
    <a class="btn btn-primary btn-sm" href="new-game.html" data-i18n>+ New Game</a>
  </div>
  <div id="root" class="spinner" data-i18n>Loading…</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script src="theme.js"></script>
<script src="ui.js"></script>
<script src="avatar.js"></script>
<script src="achievements.js"></script>
<script src="stats-table.js"></script>
<script src="search.js"></script>
<script src="game-card.js"></script>
<script src="shared.js"></script>
<script src="pace-filter.js"></script>
<script src="game-log.js"></script>

</body>
</html>
