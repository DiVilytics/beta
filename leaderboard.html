<body>

<nav>
  <a class="nav-brand" href="index.html"><img src="asset/logos/logo-b.svg" alt="DiVilytics | Disney Villainous Analytics"></a>
  <div class="nav-right">
    <div class="nav-links">
      <a href="new-game.html" title="New Game" data-i18n-attr="title">🎲</a>
      <a href="game-log.html" title="Game Log" data-i18n-attr="title">🕒</a>
      <a href="leaderboard.html" title="Leaderboard" data-i18n-attr="title">🏆</a>
      <a href="villains.html" title="Villains" data-i18n-attr="title">🎭</a>
      <a href="players.html" id="navProfile" title="Player" data-i18n-attr="title">👤</a>
      <a href="charts.html" title="Charts" data-i18n-attr="title">📊</a>
    </div>
    <div class="nav-auth" id="navAuth"></div>
  </div>
</nav>

<main>
  <div class="page-header">
    <h2 data-i18n>Leaderboard</h2>
    <!-- Villains / Players tab -->
    <div class="seg">
      <button class="seg-btn on" id="tabChars"  onclick="setTab('characters')" data-i18n>Villains</button>
      <button class="seg-btn"   id="tabPlayers" onclick="setTab('players')" data-i18n>Players</button>
    </div>
  </div>
  <p class="page-intro" data-i18n>Villains and players ranked by their results.</p>

  <div class="controls">
    <!-- Player-count filter -->
    <div class="pill-group" id="filterPills">
      <button class="pill on" onclick="setFilter('all')" data-i18n>All</button>
      <button class="pill"   onclick="setFilter(2)">2p</button>
      <button class="pill"   onclick="setFilter(3)">3p</button>
      <button class="pill"   onclick="setFilter(4)">4p</button>
      <button class="pill"   onclick="setFilter(5)">5p</button>
      <button class="pill"   onclick="setFilter(6)">6p</button>
    </div>
  </div>

  <!-- Summary stats -->
  <div class="summary" id="summary"></div>

  <!-- Table -->
  <div id="lb" class="spinner" data-i18n>Loading…</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
